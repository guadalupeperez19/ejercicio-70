<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 70 - Módulo de Operaciones</title>
    <style>
        body { font-family: sans-serif; padding: 24px; }
        ul { line-height: 1.8; }
    </style>
</head>
<body>
    <h1>Ejercicio 70: Funciones Matemáticas (Suma, Resta, Multiplicación)</h1>
    <ul id="resultados-op"></ul>

    <script>
        const operaciones = {
            sumar: (a, b) => a + b,
            restar: (a, b) => a - b,
            multiplicar: (a, b) => a * b
        };

        const a = 12;
        const b = 4;

        const resultados = [
            `Suma (${a} + ${b}): ${operaciones.sumar(a, b)}`,
            `Resta (${a} - ${b}): ${operaciones.restar(a, b)}`,
            `Multiplicación (${a} * ${b}): ${operaciones.multiplicar(a, b)}`
        ];

        console.log(resultados);

        const ul = document.getElementById("resultados-op");
        resultados.forEach((r) => {
            const li = document.createElement("li");
            li.textContent = r;
            ul.appendChild(li);
        });
    </script>
</body>
</html>
